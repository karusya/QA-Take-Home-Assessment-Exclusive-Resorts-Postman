name: Playwright Tests

# Not wired to run automatically on this repo (there's no CI runner
# configured for it yet) -- committed so the pipeline shape is reviewable
# and can be enabled by removing the `if: false` guard below, or by
# uncommenting the push/pull_request triggers once this repo has a home.
on:
  workflow_dispatch: {}
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        run: npm test
        env:
          CI: true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

      - name: 🚀 Deploy report to GitHub Pages
        if: always() && hashFiles('playwright-report/**') != ''
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: playwright-report
          destination_dir: run-${{ github.run_number }}
          keep_files: true

      - name: 📋 Report link
        if: always() && hashFiles('playwright-report/**') != ''
        run: |
          echo "### 📊 Playwright HTML report" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/run-${{ github.run_number }}/" >> "$GITHUB_STEP_SUMMARY"
