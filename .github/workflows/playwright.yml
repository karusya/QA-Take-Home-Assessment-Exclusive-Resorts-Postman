name: QA Suite

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run'
        required: true
        default: 'both'
        type: choice
        options:
          - ui
          - api
          - both
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── UI tests ──────────────────────────────────────────────────────────────
  ui-tests:
    name: UI tests (chromium)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'ui' || inputs.suite == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npm run test:web
        env:
          CI: true

      - name: Upload UI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-traces
          path: test-results/
          retention-days: 7

  # ── API tests ─────────────────────────────────────────────────────────────
  api-tests:
    name: API-endpoint tests (chromium)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'api' || inputs.suite == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run API-endpoint tests
        run: npm run test:api-endpoints
        env:
          CI: true

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-traces
          path: test-results/
          retention-days: 7

  # ── Publish to GitHub Pages ────────────────────────────────────────────────
  publish-report:
    name: Publish report to GitHub Pages
    needs: [ui-tests, api-tests]
    # Run after tests finish; skip on PRs (report stays as artifact only)
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download UI report
        if: needs.ui-tests.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: ui-report
          path: _site/ui/

      - name: Download API report
        if: needs.api-tests.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: api-report
          path: _site/api/

      - name: Create landing page
        run: |
          mkdir -p _site
          UI_STATUS="${{ needs.ui-tests.result }}"
          API_STATUS="${{ needs.api-tests.result }}"

          ui_link=""
          api_link=""

          if [ "$UI_STATUS" != "skipped" ]; then
            ui_badge="✅ passed"
            [ "$UI_STATUS" = "failure" ] && ui_badge="❌ failed"
            [ "$UI_STATUS" = "cancelled" ] && ui_badge="⚠️ cancelled"
            ui_link="<li><a href='ui/index.html'>UI tests — $ui_badge</a></li>"
          fi

          if [ "$API_STATUS" != "skipped" ]; then
            api_badge="✅ passed"
            [ "$API_STATUS" = "failure" ] && api_badge="❌ failed"
            [ "$API_STATUS" = "cancelled" ] && api_badge="⚠️ cancelled"
            api_link="<li><a href='api/index.html'>API tests — $api_badge</a></li>"
          fi

          cat > _site/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>QA Report — Exclusive Resorts</title>
            <style>
              body { font-family: sans-serif; max-width: 600px; margin: 60px auto; }
              h1 { font-size: 1.4rem; }
              ul { line-height: 2; }
              a { color: #0366d6; }
            </style>
          </head>
          <body>
            <h1>QA Report</h1>
            <p>Run: <strong>${{ github.run_number }}</strong> &nbsp;·&nbsp; ${{ github.sha }}</p>
            <ul>$ui_link $api_link</ul>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
